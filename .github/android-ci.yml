# GitHub Actions — automatically builds the Fawad's AI app on every push/PR.
# After a successful run, download the APKs from:
#   Repository → Actions → (run) → Artifacts
name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Upload APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug + Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Show build outputs
        run: |
          echo "=== APKs ==="
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FawadsAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FawadsAI-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
