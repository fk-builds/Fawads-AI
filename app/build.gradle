import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// ─────────────────────────────────────────────────────────────────────────────
//  Release signing — read from the git-ignored `keystore.properties`.
//  Created on the phone with:  bash scripts/make-keystore.sh
//  If the key file is missing we fall back to the debug key so a build never
//  hard-fails (a debug-signed APK still installs on any device; it just can't
//  go to Play and can't be produced later with a different key without
//  uninstalling).
// ─────────────────────────────────────────────────────────────────────────────
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def releaseStoreFileName = keystoreProps.getProperty('storeFile') ?: ''
def hasReleaseKey = !releaseStoreFileName.isEmpty() &&
        new File(rootProject.projectDir, releaseStoreFileName).exists()

// ─────────────────────────────────────────────────────────────────────────────
//  Version — single source of truth: version.properties (override with
//  -PVERSION_CODE=12 -PVERSION_NAME=1.2.0 for a one-off build).
// ─────────────────────────────────────────────────────────────────────────────
def versionProps = new Properties()
def versionPropsFile = rootProject.file('version.properties')
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def versionValue = { String key, String fallback ->
    project.hasProperty(key) ? project.property(key).toString()
            : (versionProps.getProperty(key) ?: fallback)
}
def appVersionCode = versionValue('VERSION_CODE', '1').trim().toInteger()
def appVersionName = versionValue('VERSION_NAME', '1.0.0').trim()

// Default update feed (empty = updater disabled). Users can override it in
// Settings → Updates, so this never has to change for a device-specific host.
def updateFeedUrl = project.hasProperty('UPDATE_FEED_URL') ? project.property('UPDATE_FEED_URL') : ''

android {
    namespace 'com.fawads.ai'
    compileSdk 34

    // The arm64 (Termux-on-phone) build we support ships exactly this one
    // build-tools version, so pin it: phone and PC then build identically.
    buildToolsVersion '34.0.4'

    defaultConfig {
        applicationId "com.fawads.ai"
        // Android 8.0+ — covers essentially every phone in daily use today.
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        vectorDrawables {
            useSupportLibrary true
        }

        buildConfigField 'String', 'UPDATE_FEED_URL', "\"${updateFeedUrl}\""
        buildConfigField 'int', 'BUILD_VERSION_CODE', "${appVersionCode}"
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile new File(rootProject.projectDir, releaseStoreFileName)
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Never let a lint finding stop a build that runs from a phone terminal.
    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

    packagingOptions {
        resources {
            excludes.add('/META-INF/{AL2.0,LGPL2.1}')
            excludes.add('META-INF/DEPENDENCIES')
            excludes.add('META-INF/*.version')
            excludes.add('kotlin/**')
            excludes.add('DebugProbesKt.bin')
        }
        jniLibs {
            // Keep the .so files as shipped by the AARs. AGP would otherwise
            // call llvm-strip from an NDK — and no NDK can run on arm64 Android.
            keepDebugSymbols.add('**/*.so')
            useLegacyPackaging = false
        }
    }

    // One universal APK / AAB: no per-density or per-ABI splits, so the single
    // file we hand out works on every phone (that's also what sideloading needs).
    bundle {
        language { enableSplit = false }
        density { enableSplit = false }
        abi { enableSplit = false }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

if (!hasReleaseKey) {
    logger.warn("\n[ Fawad's AI ] keystore.properties not found -> release APK is signed with the DEBUG key." +
            "\n[ Fawad's AI ] Fine for testing/sideloading. For real updates + Play Store run:  bash scripts/make-keystore.sh\n")
} else {
    logger.warn("\n[ Fawad's AI ] release build signed with: ${releaseStoreFileName} (alias ${keystoreProps.getProperty('keyAlias')})\n")
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.fragment:fragment-ktx:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'

    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // CameraX + ML Kit (Face Lock)
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:face-detection:16.1.7'
}
